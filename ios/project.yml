name: GabcaClicker
options:
  bundleIdPrefix: com.x2lamas
  deploymentTarget:
    iOS: "15.0"
targets:
  GabcaClicker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: www
        type: folder
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Gabca clicker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x2lamas.gabcaclicker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
